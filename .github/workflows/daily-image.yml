name: Generate daily quote image

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-quote-image
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Generate image and update README
        run: python main.py
        env:
          FUSIONBRAIN_API_KEY: ${{ secrets.FUSIONBRAIN_API_KEY }}
          FUSIONBRAIN_SECRET_KEY: ${{ secrets.FUSIONBRAIN_SECRET_KEY }}

      - name: Commit updated image and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git ls-files --error-unmatch daily_quote.jpg >/dev/null 2>&1 || [[ -e daily_quote.jpg ]]; then
            git add -A -- daily_quote.jpg
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update daily quote image"
            AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)"
            git_with_auth() {
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" "$@"
            }
            for attempt in 1 2 3; do
              git_with_auth fetch origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
              git rebase "origin/$TARGET_BRANCH"
              if git_with_auth push origin "HEAD:$TARGET_BRANCH"; then
                exit 0
              fi
              echo "Push attempt $attempt failed; fetching the latest branch before retrying."
            done
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.ref_name }}