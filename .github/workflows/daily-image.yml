name: Generate daily quote image

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-quote-image
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install "requests>=2.32.4"

      - name: Generate image and update README
        run: python main.py
        env:
          FUSIONBRAIN_API_KEY: ${{ secrets.FUSIONBRAIN_API_KEY }}
          FUSIONBRAIN_SECRET_KEY: ${{ secrets.FUSIONBRAIN_SECRET_KEY }}

      - name: Commit updated image and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if [[ -f daily_quote.jpg ]]; then
            git add daily_quote.jpg
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update daily quote image"
            git push
          fi